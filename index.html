<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro</title>
    <p class="subtitle">
    Organize your day efficiently 🚀
</p>
<link rel="icon" href="favicon.ico">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>✨ TaskFlow Pro</h1>

    <button id="themeBtn" onclick="toggleTheme()">
    🌙 Dark Mode
</button>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Enter a task...">
        
        <button onclick="addTask()">Add Task</button>
    </div>

    <div class="task-options">

    <select id="priority">
        <option value="High">🔴 High</option>
        <option value="Medium">🟡 Medium</option>
        <option value="Low">🟢 Low</option>
    </select>

    <input type="date" id="dueDate">
    <select id="category">
    <option value="Study">📚 Study</option>
    <option value="Work">💼 Work</option>
    <option value="Personal">🏠 Personal</option>
    <option value="Fitness">🏋️ Fitness</option>
</select>

</div>

<input
    type="text"
    id="searchTask"
    placeholder="🔍 Search tasks..."
    onkeyup="searchTasks()">

    <div class="filters">
    <button onclick="filterTasks('all')">All</button>
    <button onclick="filterTasks('high')">High</button>
    <button onclick="filterTasks('medium')">Medium</button>
    <button onclick="filterTasks('low')">Low</button>
    <button onclick="clearAllTasks()" id="clearBtn">🗑️ Clear All Tasks</button>
</div>

   <div class="dashboard">

    <div class="card">
        <h3 id="total">0</h3>
        <p>📋 Total Tasks</p>
    </div>

    <div class="card">
        <h3 id="completed">0</h3>
        <p>✅ Completed</p>
    </div>

    <div class="card">
        <h3 id="pending">0</h3>
        <p>⏳ Pending</p>
    </div>
    <div class="card">
    <h3 id="percentage">0%</h3>
   <p>🎯 Completion</p>
</div>

</div>
<div class="progress-section">

    <div class="progress-container">
    <div class="progress-header">
        <span>Progress</span>
        <span id="progressPercent">0%</span>
    </div>

    <div class="progress-bar">
        <div id="progressFill"></div>
    </div>
</div>
    <ul id="taskList"></ul>

<p id="emptyMessage">
    📝 No tasks yet. Add your first task!
</p>

</div>

<script src="script.js"></script>
<footer>
    © 2026 TaskFlow Pro | Designed & Developed by Susheela K C 💖
</footer>
</body>
</html>
